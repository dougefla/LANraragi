# Redis configuration file
# Basic settings
port 6379
bind 0.0.0.0

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000
rdbcompression yes
dbfilename dump.rdb

# Encoding settings
# Force Redis to properly handle UTF-8
io-encoding utf8
io-threads 4

# Logging
loglevel notice
logfile "" 